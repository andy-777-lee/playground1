<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>고속도로 구간단속 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { width: 100%; height: 100%; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); min-width: 220px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; }
  .swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .up { background: #e63946; }
  .down { background: #1d4ed8; }
  #status { font-size: 12px; color: #555; margin-top: 6px; }
  #controls { margin-top: 8px; }
  #controls label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div id="panel">
  <h1>고속도로 구간단속 카메라</h1>
  <div class="legend"><span class="swatch up"></span> 상행</div>
  <div class="legend"><span class="swatch down"></span> 하행</div>
  <div id="controls">
    <label><input type="checkbox" id="toggleUp" checked /> 상행 표시</label>
    <label><input type="checkbox" id="toggleDown" checked /> 하행 표시</label>
  </div>
  <div id="status">로딩 중...</div>
</div>
<div id="map"></div>
<script>
  const UP_COLOR = '#e63946';
  const DOWN_COLOR = '#1d4ed8';

  const map = L.map('map', { center: [36.5, 127.8], zoom: 7 });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  const upGroup = L.featureGroup().addTo(map);
  const downGroup = L.featureGroup().addTo(map);
  const groups = { up: upGroup, down: downGroup };

  (async () => {
    const status = document.getElementById('status');
    status.textContent = '데이터 불러오는 중...';

    let data;
    try {
      const r = await fetch('/api/section-cameras');
      if (!r.ok) throw new Error(await r.text());
      data = await r.json();
    } catch (e) {
      status.textContent = '데이터 로드 실패: ' + e.message;
      return;
    }

    let drawn = 0;
    const allBounds = [];

    data.sections.forEach((sec) => {
      if (sec.direction === 'unknown') return;
      const color = sec.direction === 'up' ? UP_COLOR : DOWN_COLOR;
      const start = [sec.start.lat, sec.start.lng];
      const end = [sec.end.lat, sec.end.lng];

      const popupHtml = `
        <div style="font-size:13px;line-height:1.5;">
          <div><b>${sec.routeNm || ''} (${sec.routeNo || ''})</b></div>
          <div>${sec.direction === 'up' ? '상행' : '하행'} · 제한속도 ${sec.limitSpeed ?? '-'} km/h</div>
          <div>${sec.startName || ''} → ${sec.endName || ''}</div>
        </div>`;

      const line = L.polyline([start, end], {
        color, weight: 5, opacity: 0.85,
      }).bindPopup(popupHtml);

      const startDot = L.circleMarker(start, {
        radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1,
      }).bindPopup(popupHtml);

      const endDot = L.circleMarker(end, {
        radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1,
      }).bindPopup(popupHtml);

      groups[sec.direction].addLayer(line);
      groups[sec.direction].addLayer(startDot);
      groups[sec.direction].addLayer(endDot);

      allBounds.push(start, end);
      drawn += 1;
    });

    if (allBounds.length > 0) map.fitBounds(allBounds, { padding: [20, 20] });
    status.textContent = `구간단속 ${drawn}개 표시 (총 ${data.count})`;

    document.getElementById('toggleUp').addEventListener('change', (e) => {
      if (e.target.checked) upGroup.addTo(map); else upGroup.remove();
    });
    document.getElementById('toggleDown').addEventListener('change', (e) => {
      if (e.target.checked) downGroup.addTo(map); else downGroup.remove();
    });
  })();
</script>
</body>
</html>
