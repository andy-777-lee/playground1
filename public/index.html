<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>고속도로 구간단속 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { width: 100%; height: 100%; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.95); padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); min-width: 220px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; }
  .swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .up { background: #e63946; }
  .down { background: #1d4ed8; }
  #status { font-size: 12px; color: #555; margin-top: 6px; }
  #controls { margin-top: 8px; }
  #controls label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
</style>
<script src="/config.js"></script>
</head>
<body>
<div id="panel">
  <h1>고속도로 구간단속 카메라</h1>
  <div class="legend"><span class="swatch up"></span> 상행</div>
  <div class="legend"><span class="swatch down"></span> 하행</div>
  <div id="controls">
    <label><input type="checkbox" id="toggleUp" checked /> 상행 표시</label>
    <label><input type="checkbox" id="toggleDown" checked /> 하행 표시</label>
  </div>
  <div id="status">로딩 중...</div>
</div>
<div id="map"></div>
<script>
  const clientId = (window.__APP_CONFIG__ || {}).naverMapClientId;
  if (!clientId) {
    document.getElementById('status').textContent =
      'NAVER_MAP_CLIENT_ID 가 설정되지 않았습니다. 서버 실행 시 환경변수를 지정하세요.';
  } else {
    const s = document.createElement('script');
    s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=${encodeURIComponent(clientId)}`;
    s.onload = init;
    s.onerror = () => {
      document.getElementById('status').textContent = '네이버 지도 스크립트 로드 실패. Client ID 확인 필요.';
    };
    document.head.appendChild(s);
  }

  const UP_COLOR = '#e63946';
  const DOWN_COLOR = '#1d4ed8';

  const overlays = { up: [], down: [] };

  async function init() {
    const map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(36.5, 127.8),
      zoom: 7,
    });

    const status = document.getElementById('status');
    status.textContent = '데이터 불러오는 중...';

    let data;
    try {
      const r = await fetch('/api/section-cameras');
      if (!r.ok) throw new Error(await r.text());
      data = await r.json();
    } catch (e) {
      status.textContent = '데이터 로드 실패: ' + e.message;
      return;
    }

    const bounds = new naver.maps.LatLngBounds();
    let drawn = 0;

    data.sections.forEach((sec) => {
      if (sec.direction === 'unknown') return;
      const color = sec.direction === 'up' ? UP_COLOR : DOWN_COLOR;
      const startLL = new naver.maps.LatLng(sec.start.lat, sec.start.lng);
      const endLL = new naver.maps.LatLng(sec.end.lat, sec.end.lng);

      const line = new naver.maps.Polyline({
        map,
        path: [startLL, endLL],
        strokeColor: color,
        strokeOpacity: 0.85,
        strokeWeight: 5,
      });

      const startMarker = new naver.maps.Marker({
        map,
        position: startLL,
        icon: {
          content: `<div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,0.5);"></div>`,
          anchor: new naver.maps.Point(7, 7),
        },
      });
      const endMarker = new naver.maps.Marker({
        map,
        position: endLL,
        icon: {
          content: `<div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,0.5);"></div>`,
          anchor: new naver.maps.Point(7, 7),
        },
      });

      const infoHtml = `
        <div style="padding:8px 10px;font-size:13px;line-height:1.4;">
          <div><b>${sec.routeNm || ''} (${sec.routeNo || ''})</b></div>
          <div>${sec.direction === 'up' ? '상행' : '하행'} · 제한속도 ${sec.limitSpeed ?? '-'} km/h</div>
          <div>${sec.startName || ''} → ${sec.endName || ''}</div>
        </div>`;
      const info = new naver.maps.InfoWindow({ content: infoHtml, borderWidth: 0, disableAnchor: true });
      naver.maps.Event.addListener(line, 'click', (e) => info.open(map, e.coord));
      naver.maps.Event.addListener(startMarker, 'click', () => info.open(map, startLL));
      naver.maps.Event.addListener(endMarker, 'click', () => info.open(map, endLL));

      overlays[sec.direction].push(line, startMarker, endMarker);

      bounds.extend(startLL);
      bounds.extend(endLL);
      drawn += 1;
    });

    if (drawn > 0) map.fitBounds(bounds);
    status.textContent = `구간단속 ${drawn}개 표시 (총 ${data.count})`;

    document.getElementById('toggleUp').addEventListener('change', (e) => {
      overlays.up.forEach((o) => o.setMap(e.target.checked ? map : null));
    });
    document.getElementById('toggleDown').addEventListener('change', (e) => {
      overlays.down.forEach((o) => o.setMap(e.target.checked ? map : null));
    });
  }
</script>
</body>
</html>
